name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── Rust backend ──────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Rust backend (release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ── Flutter GUI ───────────────────────────────────────────────────────
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Flutter Windows (release)
        working-directory: flutter_app
        run: flutter build windows --release

      # ── Copy daemon exe next to Flutter output ────────────────────────────
      - name: Copy devcleaner.exe into Flutter output
        run: |
          Copy-Item `
            "target\x86_64-pc-windows-msvc\release\devcleaner.exe" `
            "flutter_app\build\windows\x64\runner\Release\devcleaner.exe"

      # ── Inno Setup installer ──────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          iscc /O"dist" installer\devcleaner.iss

      # ── Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DevCleanerSetup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
